spring:
  application:
    name: janela
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:gemma3:4b}
        temperature: 0.4
    # Fail fast: when Ollama is down the use case falls back to the template narrative.
    retry:
      max-attempts: 1
  # Defaults for the auto-configured RestClient.Builder, used by the Ollama client.
  # The Open-Meteo clients set their own timeouts (janela.open-meteo.*).
  http:
    clients:
      connect-timeout: 5s
      read-timeout: ${OLLAMA_TIMEOUT:30s}

janela:
  open-meteo:
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1
    forecast-base-url: https://api.open-meteo.com/v1
    connect-timeout: 5s
    read-timeout: 10s
  cors:
    allowed-origins: http://localhost:5173
