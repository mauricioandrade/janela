spring:
  application:
    name: janela
  # Requests wait up to OLLAMA_TIMEOUT on the model; virtual threads keep that from tying up platform threads.
  threads:
    virtual:
      enabled: true
  # Native API versioning (Spring Framework 7): /api/v1/... — the second path segment is the version.
  mvc:
    apiversion:
      use:
        path-segment: 1
      supported: v1
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:gemma3:4b}
        temperature: 0.4
    # Fail fast: when Ollama is down the use case falls back to the template narrative.
    retry:
      max-attempts: 1
  # Defaults for the auto-configured RestClient.Builder, used by the Ollama client.
  # The Open-Meteo clients set their own timeouts (janela.open-meteo.*).
  http:
    clients:
      connect-timeout: 2s
      read-timeout: ${OLLAMA_TIMEOUT:30s}

janela:
  open-meteo:
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1
    forecast-base-url: https://api.open-meteo.com/v1
    connect-timeout: 5s
    read-timeout: 10s
  cors:
    allowed-origins: http://localhost:5173
