spring:
  application:
    name: janela
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:gemma3:4b}
          temperature: 0.4

janela:
  open-meteo:
    geocoding-base-url: https://geocoding-api.open-meteo.com/v1
    forecast-base-url: https://api.open-meteo.com/v1
    connect-timeout: 5s
    read-timeout: 10s
